# Big Data Systems (24CI51) - local infrastructure.
# 8 GB laptop: start ONE profile at a time, e.g.
#   docker compose --profile hive up -d
#   docker compose --profile hive down
services:

  # ---------------- Activity 1: Apache Hive (HiveServer2 + embedded Derby metastore)
  hive:
    image: apache/hive:4.0.1
    profiles: ["hive"]
    container_name: hive4
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: "-Xmx2g"
    ports:
      - "10000:10000"   # HiveServer2 JDBC/Thrift
      - "10002:10002"   # HiveServer2 Web UI
    volumes:
      - ./activity1_hive:/opt/assignment   # scripts + data visible inside container

  # ---------------- Activity 2 (and 3): Apache Kafka, single node, KRaft mode (no ZooKeeper)
  kafka:
    image: apache/kafka:4.1.0
    profiles: ["kafka", "flink"]
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"                    # for clients on the Windows host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # combined mode: one JVM is broker + controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # topics are created explicitly
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  # ---------------- Activity 2: web console for topics / consumer groups (evidence only)
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["kafka"]
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartcity-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx256m"
    depends_on: [kafka]

  # ---------------- Activity 3: Apache Flink 1.20.5 session cluster (PyFlink image, see activity3_flink/Dockerfile)
  # Memory tuned for an 8 GB laptop: JM 768 MB + TM 1152 MB (defaults are ~1.6 GB + ~1.7 GB).
  jobmanager:
    image: bigdata/pyflink:1.20.5
    profiles: ["flink"]
    container_name: flink-jobmanager
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"                    # Flink Web UI / REST API
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 768m
        parallelism.default: 2
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        web.submit.enable: false
    volumes:
      - ./activity3_flink:/opt/activity3
    depends_on: [kafka]

  taskmanager:
    image: bigdata/pyflink:1.20.5
    profiles: ["flink"]
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1152m
        taskmanager.memory.managed.fraction: 0.1
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    volumes:
      - ./activity3_flink:/opt/activity3
    depends_on: [jobmanager]

  # ---------------- Activity 4: MongoDB Community Server 8.0
  mongodb:
    image: mongo:8.0
    profiles: ["mongo"]
    container_name: mongodb
    command: ["--wiredTigerCacheSizeGB", "0.25"]   # cap the storage-engine cache for an 8 GB laptop
    ports:
      - "127.0.0.1:27017:27017"                    # reachable from this machine only (no auth in this demo)
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
